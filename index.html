<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Life Dashboard</h1>
    <button id="theme-btn" class="icon-btn" aria-label="Toggle theme">🌙</button>
  </header>

  <main class="grid">
    <!-- Greeting -->
    <section class="card">
      <p id="clock" class="big">00:00:00</p>
      <p id="date" class="muted"></p>
      <h2 id="greeting">Hello</h2>
      <form id="name-form" class="row">
        <input id="name-input" type="text" placeholder="Your name" maxlength="20">
        <button type="submit">Save</button>
      </form>
    </section>

    <!-- Focus Timer -->
    <section class="card">
      <h2>Focus Timer</h2>
      <p id="timer" class="big">25:00</p>
      <div class="row">
        <button id="start-btn">Start</button>
        <button id="stop-btn" class="secondary">Stop</button>
        <button id="reset-btn" class="secondary">Reset</button>
      </div>
    </section>

    <!-- To-Do List -->
    <section class="card wide">
      <h2>To-Do List</h2>
      <form id="todo-form" class="row">
        <input id="todo-input" type="text" placeholder="Add a new task..." required>
        <button type="submit">Add</button>
      </form>
      <p id="todo-msg" class="error"></p>
      <ul id="todo-list"></ul>
    </section>

    <!-- Quick Links -->
    <section class="card wide">
      <h2>Quick Links</h2>
      <div id="links" class="links"></div>
      <form id="link-form" class="row">
        <input id="link-name" type="text" placeholder="Name (e.g. YouTube)" required>
        <input id="link-url" type="text" placeholder="URL (e.g. youtube.com)" required>
        <button type="submit">Add</button>
      </form>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
